<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUNSEOK.zip - contents</title>
  
  <link rel="stylesheet" href="css/style.css?v=2.0">
  
  <style>
    /* main.html 專用的復古視窗排版 */
    
    body {
      /* 確保內容水平垂直置中 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
    }

    /* 復古視窗本體 */
    .window-container {
      background-color: #f1f1f1; /* 視窗底色 */
      width: 90%;
      max-width: 800px;
      height: 70vh; /* 固定高度，內容多時可滾動 */
      border: 3px solid #2b2b2b; /* 粗邊框 */
      border-radius: 12px; /* 圓角 */
      box-shadow: 6px 6px 0px rgba(0,0,0,0.2); /* 復古陰影 */
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 確保內容不會超出邊框 */
    }

    /* 視窗頂部的藍色標題列 */
    .window-header {
      background-color: #a1c4fd; /* 跟背景一樣的藍色 */
      padding: 10px 15px;
      border-bottom: 3px solid #2b2b2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-title {
      color: #2b2b2b;
      font-weight: bold;
      font-size: 1.1rem;
      margin: 0;
      font-family: 'KoreanFont', sans-serif !important;
    }

    /* 右上角的關閉/縮小按鈕 */
    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #2b2b2b;
    }
    .win-red { background-color: #ff5f57; }
    .win-yellow { background-color: #ffbd2e; }
    .win-green { background-color: #28c940; }

    /* 視窗內容區域 (放資料夾的地方) */
    .window-content {
      padding: 30px;
      flex-grow: 1; /* 佔滿剩餘高度 */
      overflow-y: auto; /* 內容多時出現捲軸 */
      background-color: #ffffff; /* 內容區域底色 */
      
      /* 資料夾排版 (格狀) */
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* 自動依寬度排列 */
      gap: 25px;
      justify-items: center;
      align-items: start;
    }

    /* --- 手繪黃色資料夾樣式 (用 CSS 製作) --- */
    
    .folder-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 100px;
      transition: transform 0.1s ease;
    }

    .folder-wrapper:hover {
      transform: scale(1.05); /* 滑鼠移上去微微放大 */
    }

    /* 資料夾圖示 (黃色) */
    .folder-icon {
      width: 70px;
      height: 50px;
      background-color: #ffe66d; /* 手繪黃色 */
      border: 3px solid #2b2b2b;
      border-radius: 5px 15px 5px 5px; /* 不規則圓角營造手繪感 */
      position: relative;
      margin-bottom: 8px;
    }

    /* 資料夾上面的小耳朵 */
    .folder-icon::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 8px;
      width: 30px;
      height: 12px;
      background-color: #ffe66d;
      border: 3px solid #2b2b2b;
      border-bottom: none; /* 底部沒有邊框 */
      border-radius: 5px 5px 0 0;
    }

    /* 資料夾文字 (如：01_Profile) */
    .folder-name {
      font-size: 1.2rem;
      color: #2b2b2b;
      text-align: center;
      font-weight: normal;
      word-wrap: break-word; /* 確保文字太長會斷行 */
      font-family: 'enfont', sans-serif !important;
    }

    /* --- 獨立浮動音樂視窗 (修正版：移除 top/left 的 !important) --- */
    .draggable-window {
      position: fixed;
      width: 420px;
      box-sizing: border-box;
      background-color: #fff6e5;
      border: 3px solid #525142;
      border-radius: 16px;
      box-shadow: 6px 6px 0px #cdd487;
      z-index: 999999;
      overflow: hidden;
    }

    .drag-header {
      padding: 10px 15px;
      cursor: move;
      background-color: #ffe66d;
      border-bottom: 3px solid #2b2b2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .modal-title {
      font-family: 'KoreanFont', sans-serif !important;
      font-weight: bold;
      color: #2b2b2b;
      font-size: 1.5rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      color: #2b2b2b;
      line-height: 1;
    }

    .close-btn:hover {
      color: #ff5f57;
    }

    .drag-body {
      padding: 12px;
      background-color: #fff6e5;
      display: block;
      width: 100%;
      box-sizing: border-box;
    }

    .drag-body iframe {
      width: 100%;
      display: block;
      border: none;
    }
  </style>
</head>
<body>

  <div class="window-container">
    
    <div class="window-header">
      <h2 style="font-family: 'KoreanFont', sans-serif;
  font-size: 3.5rem;
  color: #4A4A4A;
  letter-spacing: 2px;
  line-height: 1;
  margin: 0;">EUNSEOK.zip/extracted</h2>
      <div class="window-controls">
        <div class="win-btn win-green"></div>
        <div class="win-btn win-yellow"></div>
        <div class="win-btn win-red"></div>
      </div>
    </div>

    <div class="window-content">

      <div class="folder-wrapper" onclick="openModal('profile')">
        <div class="folder-icon"></div>
        <span class="folder-name">Profile</span>
      </div>

      <div class="folder-wrapper" onclick="openModal('gallery')">
        <div class="folder-icon"></div>
        <span class="folder-name">Gallery</span>
      </div>

      <div class="folder-wrapper" onclick="openModal('video')">
        <div class="folder-icon"></div>
        <span class="folder-name">Memory</span>
      </div>

      <div class="folder-wrapper" onclick="openModal('audio')">
        <div class="folder-icon"></div>
        <span class="folder-name">Radio</span>
      </div>

    </div> </div> <div class="credit">by syulizhiii</div>

  <div id="audio-modal" class="draggable-window" style="display: none;">
    <div id="audio-modal-header" class="drag-header">
      <span class="modal-title">♬ SEOKSEOK RADIO</span>
      <button class="close-btn" onclick="closeModal('audio-modal')">✕</button>
    </div>

    <div class="drag-body">
      <iframe 
        data-testid="embed-iframe" 
        style="border-radius:12px;" 
        src="https://open.spotify.com/embed/playlist/2fmBlEztyZHoBzA8dbr6fk?utm_source=generator&si=8c6d4adc539a4b8a" 
        height="382" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script>
    function openModal(type) {
      if (type === 'audio') {
        const modal = document.getElementById('audio-modal');
        modal.style.display = 'block';
        
        // 用 JS 動態計算精確的螢幕正中央位置 (不受 CSS 鎖死)
        const modalWidth = 420;
        const modalHeight = 440;
        modal.style.top = Math.max(20, (window.innerHeight - modalHeight) / 2) + 'px';
        modal.style.left = Math.max(20, (window.innerWidth - modalWidth) / 2) + 'px';
        modal.style.transform = 'none';

        makeDraggable(modal, document.getElementById('audio-modal-header'));
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function makeDraggable(elmnt, header) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      
      if (header) {
        header.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        
        pos3 = e.clientX;
        pos4 = e.clientY;
        
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();

        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;

        // 取得當前真實 Viewport 座標並更新
        const rect = elmnt.getBoundingClientRect();
        elmnt.style.top = (rect.top - pos2) + "px";
        elmnt.style.left = (rect.left - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }
  </script>
</body>
</html>
