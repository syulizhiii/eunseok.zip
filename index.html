<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E:UNSEOK</title>
  <meta name="description" content="forrEUNSEOK" />
  <meta property="og:description" content="forrEUNSEOK" />
  <link rel="icon" href="images/favicon.ico" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=2.0">
</head>
<body class="bg-index">
  
  <!-- 2. 中間的主要內容區塊（把標題、石頭、進度條全部包在一起） -->
  <div class="landing-container">

    <div class="cloud-header">
      <h1 class="cloud-title">EUNSEOK.zip</h1>
    </div>

    <!-- 石頭點擊區（放回箱子裡） -->
    <div class="stone-wrapper" onclick="startUnzip()" style="cursor: pointer;">
      <img src="images/dol.png" alt="Eunseok Stone">
      <span class="hello-text">헬로</span>
    </div>

    <!-- 解壓縮進度條（放回箱子裡，在石頭正下方） -->
    <div id="progress-wrapper" style="display: none; margin-top: 15px; width: 180px; text-align: center;">
      <div style="border: 2px solid #2b2b2b; background-color: #fff; border-radius: 10px; padding: 2px;">
        <div id="progress-fill" style="width: 0%; height: 10px; background-color: #ffe66d; border-radius: 5px; transition: width 0.05s linear;"></div>
      </div>
      <p id="progress-text" style="font-size: 0.85rem; color: #2b2b2b; margin-top: 5px; font-weight: bold;">Unzipping... 0%</p>
    </div>

  </div> <!-- landing-container 結束標籤移到這裡 -->

  <!-- 3. 右下角 credit -->
  <div class="credit">by syulizhiii</div>

<script>
let isUnzipping = false;

function startUnzip() {
  if (isUnzipping) return; // 防止重複點擊
  isUnzipping = true;

  // 顯示進度條
  const progressWrapper = document.getElementById('progress-wrapper');
  const fill = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  progressWrapper.style.display = 'block';

  let progress = 0;
  const timer = setInterval(() => {
    progress += 2;
    fill.style.width = progress + '%';
    text.innerText = `Unzipping... ${progress}%`;

    if (progress >= 100) {
      clearInterval(timer);
      text.innerText = "DONE!";
      // 跑完後 0.5 秒順暢跳轉到 main.html
      setTimeout(() => {
        window.location.href = 'main.html';
      }, 500);
    }
  }, 30);
}
</script>
</body>
</html>
